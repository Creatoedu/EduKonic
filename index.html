<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduKonic Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#2a1d4d;--mut:#6a5f8a;--pri:#6b4ef0;--sun:#ffc83d;--teal:#12b5a2;--coral:#ff6b5b;--line:#e2ddf7;--soft:#ece8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18122e;--card:#251c46;--ink:#f3efff;--mut:#b4a9d9;--line:#3a2f66;--soft:#31265a}}
:root[data-theme="dark"]{--bg:#18122e;--card:#251c46;--ink:#f3efff;--mut:#b4a9d9;--line:#3a2f66;--soft:#31265a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3,.logo{font-family:Fredoka,Nunito,sans-serif;margin:0;line-height:1.15}
.app{max-width:640px;margin:0 auto;padding:12px 14px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 0 12px}
.logo{font-size:26px;font-weight:700;color:var(--pri)}.logo b{color:var(--coral);font-weight:700}
.sw{display:flex;background:var(--soft);border-radius:99px;padding:4px;border:2px solid var(--pri)}
.sw button{border:0;background:none;color:var(--ink);font:700 15px Nunito;padding:8px 14px;border-radius:99px;cursor:pointer;min-height:40px}
.sw button.on{background:var(--pri);color:#fff}
.demo{background:var(--sun);color:#2a1d4d;font-weight:800;font-size:13px;padding:6px 12px;border-radius:10px;text-align:center;margin-bottom:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:16px;font:700 19px Fredoka,Nunito;background:var(--pri);color:#fff;cursor:pointer;margin:8px 0;min-height:56px}
.btn:active{transform:scale(.98)}.btn.alt{background:var(--sun);color:#2a1d4d}.btn.teal{background:var(--teal)}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.coral{background:var(--coral)}.btn:focus-visible,.sw button:focus-visible,.chip:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn[disabled]{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{text-align:center;padding:22px 10px}
.hero .logo{font-size:52px}.tag{font-size:19px;color:var(--mut);font-weight:800;margin:6px 0 18px}
.boxlogo{font-size:64px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.stat{background:var(--soft);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font:700 28px Fredoka;color:var(--pri)}.stat span{font-size:14px;color:var(--mut);font-weight:700}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px 14px;font:700 16px Nunito;cursor:pointer;min-height:44px;margin:0 6px 8px 0}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps i{flex:1;height:8px;border-radius:9px;background:var(--line)}.steps i.d{background:var(--teal)}.steps i.c{background:var(--sun)}
.note{border-radius:20px;padding:16px;margin:10px 0;border:3px solid var(--pri);background:var(--card);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.note.t{border-color:var(--teal)}.note.s{border-color:var(--coral)}
.note h3{display:flex;gap:8px;align-items:center}.pill{font-size:12px;font-weight:800;background:var(--soft);padding:3px 9px;border-radius:9px;color:var(--mut)}
@keyframes pop{0%{transform:translateY(-30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.ring{animation:ring 1.2s ease 2}@keyframes ring{20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}}
.stage{position:relative;height:110px;background:linear-gradient(var(--soft),var(--soft));border-radius:18px;margin:10px 0;overflow:hidden;border:2px dashed var(--line)}
.stage .a,.stage .b{position:absolute;bottom:6px;font-size:13px;font-weight:800;color:var(--mut)}.stage .a{left:12px}.stage .b{right:12px}
.stage .bx{position:absolute;bottom:26px;left:10%;font-size:48px;transition:left 1.6s ease-in-out}.stage .bx.m{left:75%}
ul.l{padding-left:20px;margin:6px 0}ul.l li{margin:6px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.bar2{height:14px;border-radius:9px;background:var(--soft);overflow:hidden;margin:4px 0 10px}.bar2 i{display:block;height:100%;border-radius:9px;transition:width .8s}
.chk{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--soft);margin:6px 0;font-weight:700;cursor:pointer;min-height:48px}.chk input{width:24px;height:24px;accent-color:var(--pri)}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:600 17px Nunito;background:var(--card);color:var(--ink)}
.tog{width:56px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer}.tog.on{background:var(--coral)}.tog:after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}.tog.on:after{left:28px}
.wk{border-left:8px solid var(--pri);padding-left:12px}
.day{display:flex;gap:10px;padding:8px 0;align-items:center}.day em{font:700 14px Fredoka;font-style:normal;background:var(--soft);border-radius:10px;min-width:54px;text-align:center;padding:4px}
.mut{color:var(--mut);font-size:15px}.back{background:none;border:0;color:var(--pri);font:800 16px Nunito;cursor:pointer;padding:8px 0;min-height:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.meter{height:12px;background:var(--soft);border-radius:9px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:var(--sun);animation:fill 1.8s linear}@keyframes fill{from{width:0}to{width:100%}}

/* CreatoEdu-inspired stellar design system */
:root,:root[data-theme="dark"]{--bg:#071333;--card:#101f4b;--ink:#f9fbff;--mut:#b7c8eb;--pri:#5968ff;--sun:#ffc743;--teal:#16d2ca;--coral:#ff754b;--line:#31467a;--soft:#1b3061}
body{background:radial-gradient(ellipse at 10% 5%,#173d90 0,transparent 40%),radial-gradient(ellipse at 95% 20%,#40236d 0,transparent 37%),#071333;background-attachment:fixed;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.33;background-image:radial-gradient(1px 1px at 12% 19%,#fff 98%,transparent),radial-gradient(2px 2px at 82% 27%,#6bdeff 98%,transparent),radial-gradient(1px 1px at 56% 81%,#fff 98%,transparent),radial-gradient(2px 2px at 24% 67%,#ffbd70 98%,transparent);background-size:230px 200px,360px 280px,270px 330px,440px 380px}
.app{max-width:880px;padding:22px 18px 56px;position:relative}.bar{margin-bottom:8px}.logo{font-size:27px;color:#fff;text-shadow:0 3px 18px #368aff50}.logo b{color:#ffc743}.demo{background:#192d58;border:1px solid #4d6296;color:#d6e6ff;font-size:12px;letter-spacing:.02em;border-radius:14px;padding:10px}.card{background:linear-gradient(160deg,#142854f5,#101b40f7);border:1px solid #395184;border-radius:25px;padding:23px;box-shadow:0 16px 40px #0003}.card h2,.card h3{color:#fff}.mut,.tag{color:#b7c8eb}.btn{background:linear-gradient(110deg,#526aff,#7a4cf7);box-shadow:0 8px 20px #283ea74a;transition:transform .16s,filter .16s}.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}.btn.alt{background:linear-gradient(105deg,#ffcb45,#ff9845);color:#17204c}.btn.teal{background:linear-gradient(100deg,#0cb9be,#157dd0)}.btn.ghost{background:#1c3267;color:#eaf3ff;border:1px solid #39568e;box-shadow:none}.btn.coral{background:#fd774f}.chip{background:#1b3163;border-color:#405991;color:#f6f8ff}.chip.on{background:#515ee8}.sw{background:#162858;border:1px solid #4d68a3}.sw button{color:#dbe7ff}.sw button.on{background:#6260ed}.stat{background:#1e3569}.stat b{color:#ffcf50}.pill{background:#263f76;color:#cbdcff}.note{background:#152b59}.note.t{border-color:#12d7c1}.back{color:#9ac6ff}textarea,input[type=text]{background:#0d1b41;color:#fff;border-color:#43598a}.chk{background:#1c3261}.wk{background:#152957}.stage{background:#203767}.bar2,.meter{background:#293d70}.hero{overflow:hidden}.hero img{max-height:300px;object-fit:cover}.hero .logo{font-size:55px}.steps i{background:#334773}
.mission-shell{position:relative;overflow:hidden;border:1px solid #4662a7;border-radius:28px;background:radial-gradient(circle at 86% 15%,#3441a8 0,transparent 43%),linear-gradient(145deg,#142d68,#111d48);padding:25px;margin:0 0 15px;box-shadow:0 24px 55px #0005}.mission-shell:after{content:'✧ ✦ · ✧';position:absolute;top:17px;right:20px;color:#68d9ff99;letter-spacing:14px;font-size:20px;pointer-events:none}.eyebrow{color:#ffcb50;font-weight:900;font-size:12px;letter-spacing:2px;text-transform:uppercase}.student-hero{display:flex;align-items:center;gap:16px;margin:15px 0 22px}.student-avatar{display:grid;place-items:center;font-size:50px;width:92px;height:92px;border-radius:26px;background:linear-gradient(140deg,#3956a9,#583bbb);border:2px solid #718df9;box-shadow:0 0 30px #4067ff66}.student-hero h1{font-size:clamp(27px,5vw,40px)}.student-hero p{color:#c6d7fb;margin:6px 0 0}.mission-panel{position:relative;background:#0c1b42d9;border:1px solid #4a68ac;border-radius:23px;padding:22px}.mission-icon{font-size:38px}.mission-panel h2{font-size:26px;margin:5px 0 8px}.mission-panel p{color:#c9d7ef}.waiting-indicator{display:flex;align-items:center;gap:12px;justify-content:center;color:#ffe49c;font-weight:900;background:#2c3764;padding:14px;border-radius:14px;margin:12px 0}.pulse-dot{width:12px;height:12px;background:#33e1c6;border-radius:50%;animation:waiting 1.4s infinite}@keyframes waiting{50%{opacity:.3;transform:scale(.7)}}.joined-tag{display:inline-block;color:#92f5d5;font-size:13px;font-weight:900}.student-selector{margin:18px 0}.student-selector summary{cursor:pointer;color:#a9c7ff;font-weight:800;padding:8px}.status-banner{background:#102c5a;border:1px solid #31599c;border-radius:20px;padding:15px 18px;margin:12px 0}.meter-label{color:#dbe6ff;font-size:14px;font-weight:800}.class-meter{height:17px;border-radius:40px;overflow:hidden;background:#24365c;margin:10px 0}.class-meter>div{height:100%;background:linear-gradient(90deg,#20d7ca,#ffcb4b);transition:width .4s}.scenario-badge{display:inline-block;border:1px solid #5274ab;background:#1f3971;border-radius:999px;color:#a9e7ff;font-size:13px;font-weight:900;padding:6px 12px;margin-bottom:12px}button:focus-visible,summary:focus-visible{outline:3px solid #ffcf48;outline-offset:3px}
@media(min-width:750px){.mission-shell{padding:32px}.mission-panel{padding:28px}}@media(max-width:500px){.grid2{grid-template-columns:1fr 1fr}.student-hero{gap:11px}.student-avatar{width:72px;height:72px;font-size:39px}.mission-shell{padding:17px}.mission-panel{padding:17px}.app{padding:14px 12px 40px}.card{padding:17px}.sw button{padding:7px 10px}}@media(prefers-reduced-motion:reduce){.pulse-dot{animation:none}}

const SC=[
{e:'🪑',t:'Alone at Recess',sit:'Pretend it is recess and a classmate is sitting alone near the fence.',a1:'Pretends to be the classmate sitting alone and quietly drawing.',a2:'Pretends to be a student who notices them and decides what to say or do.',tr:'The teacher narrates, says "Freeze!" at the end, and asks the class questions.',q:'You notice someone sitting alone during recess. What would you do?',o:['Invite them to join your game','Ask whether they want company','Ignore them and keep playing','Something else'],obj:'Practice noticing others and choosing kind, respectful ways to include them.'},
{e:'🖍️',t:'The Last Blue Crayon',sit:'Two pretend students both want the last blue crayon for their pictures.',a1:'Holds the blue crayon and says they are using it.',a2:'Also needs blue and decides how to ask.',tr:'The teacher is the art helper and says "Freeze!" after one minute.',q:'Two friends both need the last blue crayon. What would you do?',o:['Take turns and set a timer','Share it by using it together','Find a different color to use','Something else'],obj:'Practice problem-solving and respectful requests when sharing.'},
{e:'📦',t:'The Mystery Supply Box',sit:'A supply box is on the wrong shelf and needs to go to the story rug.',a1:'Carries the box slowly to the story rug at the teacher\'s signal.',a2:null,tr:'The teacher gives the signal "Mystery box, on the move!" and leads the talk.',q:'You see a box in the wrong place in the classroom. What would you do?',o:['Ask the teacher where it belongs','Carry it carefully to the right spot with a friend','Leave it for someone else','Something else'],obj:'Practice noticing, asking for help, and working together.'}];

const Brand=({big})=>html`<span style=${{display:'inline-flex',alignItems:'center',gap:'8px'}}>${LOGO?html`<img src=${LOGO} alt="CreatoEdu helper" style=${{width:big?110:40,height:big?110:40,objectFit:'cover',borderRadius:'50%',border:'2px solid #ffc83d'}}/>`:html`<span className=${big?'boxlogo':''} role="img" aria-label="CreatoEdu helper logo placeholder" style=${{width:big?96:40,height:big?96:40,borderRadius:'50%',background:'linear-gradient(135deg,#6b4ef0,#12b5a2)',color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',fontFamily:'Fredoka',fontWeight:700,fontSize:big?34:15,border:'3px solid #ffc83d'}}>CE</span>`}</span>`;
function Steps({p}){return html`<div className="steps" aria-label="Activity progress">${STEPS.map((s,i)=>html`<i className=${i<p-1?'d':i===p-1?'c':''} title=${s}></i>`)}</div>`}
function Stage({phase}){const[m,setM]=useState(phase>3);
useEffect(()=>{if(phase===3){const t=setTimeout(()=>setM(true),300);return()=>clearTimeout(t)}setM(phase>3)},[phase]);
return html`<div className="stage" role="img" aria-label="Pretend supply box moving from shelf to story rug"><span className="a">Shelf</span><span className="b">Story rug</span><div className=${'bx '+(m?'m':'')}>📦</div></div>`}

function Welcome({go}){return html`<div className="card hero"><img src=${BANNER} alt="CreatoEdu: Hands-On + Digital STEM" style=${{width:'100%',borderRadius:'18px',display:'block',marginBottom:'14px'}}/><h1 className="logo">Edu<b>Konic</b></h1><p className="tag">Beyond Surveys. Into Connection.</p>
<button className="btn" onClick=${()=>go('teacher')}>👩‍🏫 Teacher Login</button><button className="btn alt" onClick=${()=>go('slogin')}>🧒 Student Login</button>
<p className="mut">Built with CreatoEdu. Demo classroom: Room 5, Sunshine Class (6 fictional students). No email needed. Prototype only: both roles run on this one device, with no real multi-device sync.</p></div>
<div className="card"><h3>What EduKonic is</h3><p className="mut" style=${{margin:'6px 0 0'}}>A 30-day program of supervised classroom activities for pre-K to grade 5. Teachers observe and record, and see how the class works together. It is <b>not</b> a diagnostic tool and never labels, scores, or ranks children.</p></div>`}

function SLogin({pick}){const[v,setV]=useState('');return html`<div className="card"><h2>Who's joining?</h2><p className="mut">Tap your picture, or type your first name.</p>
<div className="grid2">${STU.map(s=>html`<button className="btn ghost" onClick=${()=>pick(s.id)}>${s.e} ${s.n}</button>`)}</div>
<p style=${{margin:'12px 0 4px',fontWeight:800}}>Or type your first name</p><input type="text" value=${v} maxLength="20" placeholder="First name" onInput=${e=>setV(e.target.value)} aria-label="First name"/>
<button className="btn teal" disabled=${!v.trim()} onClick=${()=>{const f=STU.find(s=>s.n.toLowerCase()===v.trim().toLowerCase());pick(f?f.id:'guest:'+v.trim().slice(0,20))}}>Join class</button></div>`}

function Teacher({S,act,go,obsN,joined}){const c=SC[S.sc];
const cur=!S.live||S.phase===0&&!S.live?c.t+' (not started)':c.t+': '+STEPS[S.phase]+(S.mode==='decision'?' (Decision Mode)':'');
return html`<div className="card"><h2>Room 5: Sunshine Class</h2><p className="mut" style=${{margin:'2px 0 10px'}}>Teacher view (demo)</p>
<div className="grid2"><div className="stat"><b>${STU.filter(x=>joined[x.id]).length}/6</b><span>students joined the mission</span></div><div className="stat"><b>Day 1</b><span>of 30</span></div></div>
<div className="status-banner"><b>🚀 Mission lobby</b><p className="mut">${STU.filter(x=>joined[x.id]).length} fictional students have tapped Join. Switch to Student to join another profile.</p></div><div style=${{marginTop:'12px'}}><b>Current activity</b><div className="mut">${cur}</div></div></div>
<button className="btn" onClick=${()=>{act({live:true});go('activity')}}>${S.live?'▶ Continue Activity':'▶ Start Activity'}</button>
<button className="btn ghost" onClick=${()=>go('observations')}>📝 View Observations (${obsN})</button>
<button className="btn ghost" onClick=${()=>go('insights')}>📊 Classroom Insights</button>
<button className="btn ghost" onClick=${()=>go('program')}>🗓 30-Day Program</button>`}

function Spin({pool,done}){const[i,setI]=useState(0);useEffect(()=>{const a=setInterval(()=>setI(x=>x+1),110);const b=setTimeout(done,1800);return()=>{clearInterval(a);clearTimeout(b)}},[]);const s=pool[i%pool.length];
return html`<div className="note" style=${{textAlign:'center'}}><div className="ring" style=${{fontSize:'44px'}}>🎲</div><h2>${s.e} ${s.n}</h2><div className="meter"><i></i></div><p className="mut">Choosing from volunteers…</p></div>`}

function Summary({S,c}){const A=STU.map(s=>S.answers[s.id]).filter(Boolean);const R=A.filter(a=>a.w).map(a=>a.w);
return html`<div className="card"><h3>📊 Anonymous class answers (${A.length} of 6)</h3>${c.o.map((o,j)=>{const n=A.filter(a=>a.a===j).length;return html`<div><div style=${{display:'flex',justifyContent:'space-between',fontWeight:700}}><span>${'ABCD'[j]}. ${o}</span><span className="mut">${n}</span></div><div className="bar2"><i style=${{width:(A.length?n/A.length*100:0)+'%',background:'var(--pri)'}}></i></div></div>`})}
${R.length>0&&html`<div><b>Reasons shared (no names)</b><ul className="l">${R.map(r=>html`<li>“${r}”</li>`)}</ul></div>`}
<p className="mut">There is no "best" answer. Use these to explore different choices and what might happen next.</p></div>`}

function Activity({S,act,go}){const c=SC[S.sc],p=S.phase,need=c.a2?2:1;
const H=STU.filter(s=>S.resp[s.id]==='help'),O=STU.filter(s=>S.resp[s.id]==='observe'),N=STU.length-H.length-O.length;
const ids=S.actors.map(a=>a.id),pid=S.pending?S.pending.id:'';
const pool=H.filter(s=>!ids.includes(s.id)&&!S.skip.includes(s.id)&&s.id!==pid);
const startPick=()=>{if(!pool.length)return;const s=pool[Math.floor(Math.random()*pool.length)];act({phase:2,mode:'role',pending:{id:s.id,role:'Actor '+(S.actors.length+1)},spin:true})};
const dm=()=>act({mode:'decision',phase:4,actors:[],pending:null,spin:false});
const next=()=>act({...S0,live:true,sc:(S.sc+1)%SC.length});
const simR=a=>{const r={};STU.forEach((s,i)=>{r[s.id]=a==='mix'?(i%3===2?'observe':i%3===1?(i>3?undefined:'help'):'help'):a});if(a==='mix')delete r.sam;act({resp:r,closed:false})};
const WHY=['I would want someone to include me.','It depends on how my friend feels.','Asking first seems respectful.','I would get a grown-up to help.'];
const simA=()=>{const a={...S.answers};STU.forEach(s=>{a[s.id]={a:Math.floor(Math.random()*4),w:Math.random()<.4?WHY[Math.floor(Math.random()*4)]:''}});act({answers:a})};
const zero=H.length===0&&(S.closed||N===0)&&p===1;
return html`<div><button className="back" onClick=${()=>go('teacher')}>‹ Dashboard</button><h2>${c.e} ${c.t}</h2>
<p className="mut" style=${{margin:'2px 0 8px'}}>Scenario ${S.sc+1} of ${SC.length}${S.mode==='decision'&&p>=4?' · Decision Mode':''}</p><${Steps} p=${p+1}/>
${p===0&&html`<div><div className="card"><h3>Read this scenario aloud</h3><p><b>Situation:</b> ${c.sit}</p><ul className="l"><li><b>Actor 1:</b> ${c.a1}</li>${c.a2&&html`<li><b>Actor 2:</b> ${c.a2}</li>`}<li><b>Teacher:</b> ${c.tr}</li></ul><p><b>Question:</b> ${c.q}</p><p className="mut">Goal: ${c.obj}</p></div>
<div><span className="mut">Choose a scenario:</span><br/>${SC.map((x,i)=>html`<button className=${'chip '+(i===S.sc?'on':'')} onClick=${()=>act({...S0,live:true,sc:i})}>${x.e} ${x.t}</button>`)}</div>
<button className="btn" onClick=${()=>act({live:true,phase:1,resp:{},closed:false})}>📲 Send the choice prompt to students</button><p className="mut">Students see what the activity involves, then choose privately. Both choices are meaningful, and nobody is ever required to act.</p></div>`}
${p===1&&html`<div><div className="note t"><h3>📲 Students are choosing privately</h3><div className="grid2" style=${{gridTemplateColumns:'repeat(3,1fr)'}}><div className="stat"><b>${H.length}</b><span>🙋 helping</span></div><div className="stat"><b>${O.length}</b><span>👀 observing</span></div><div className="stat"><b>${N}</b><span>⏳ not yet</span></div></div>
<p style=${{margin:'10px 0 4px'}}><b>Available to be actors:</b></p>${H.length?H.map(s=>html`<span className="chip on">${s.e} ${s.n}</span>`):html`<span className="mut">Nobody yet. Non-responders are never added.</span>`}</div>
${zero&&html`<div className="note s"><h3>🤔 No helpers this round! Let's think it through together.</h3><p>That's okay. Switch to Decision Mode so everyone can still explore the scenario.</p><button className="btn coral" onClick=${dm}>Switch to Decision Mode</button></div>`}
${H.length>0&&html`<button className="btn" onClick=${startPick}>🎲 Pick a Random Helper</button>`}
${!zero&&N>0&&html`<button className="btn ghost" onClick=${()=>act({closed:true})}>Close responses (${N} not yet answered)</button>`}
${!zero&&html`<button className="btn ghost" onClick=${dm}>Switch to Decision Mode</button>`}
<div className="card"><b>Demo tools</b><p className="mut" style=${{margin:'2px 0'}}>Or switch to Student view and tap a name.</p><button className="chip" onClick=${()=>simR('mix')}>Simulate class choices</button><button className="chip" onClick=${()=>simR('observe')}>Everyone observes</button><button className="chip" onClick=${()=>act({resp:{},closed:false})}>Clear choices</button></div></div>`}
${p===2&&html`<div>${S.spin?html`<${Spin} pool=${H} done=${()=>act({spin:false})}/>`:S.pending?html`<div className="note t"><h3><span className="ring">🔔</span> Selected: ${nm(S.pending.id)} for ${S.pending.role}</h3><p>Waiting for ${nm(S.pending.id)} to say yes. They can say "No thanks" at any time, no questions asked.</p>
<button className="btn alt" onClick=${()=>act({actors:[...S.actors,{id:S.pending.id,role:S.pending.role}],pending:null})}>Demo: ${nm(S.pending.id)} says yes</button>
<button className="btn ghost" onClick=${()=>act({resp:{...S.resp,[S.pending.id]:'observe'},pending:null})}>Demo: ${nm(S.pending.id)} says no thanks</button>
<button className="btn ghost" onClick=${()=>act({skip:[...S.skip,S.pending.id],pending:null})}>Pick someone else</button></div>`:html`<div className="card"><h3>Helpers (${S.actors.length} of ${need})</h3>${S.actors.map(a=>html`<div className="row"><b>${nm(a.id)}</b><span className="pill">${a.role}</span></div>`)}
${S.actors.length<need&&pool.length>0&&html`<button className="btn" onClick=${startPick}>🎲 Pick another random helper</button>`}
${S.actors.length<need&&pool.length===0&&html`<div><p><b>No more volunteers available.</b></p><button className="btn coral" onClick=${dm}>Switch to Decision Mode</button></div>`}
${S.actors.length>=need&&html`<button className="btn teal" onClick=${()=>act({phase:3})}>🎬 Start the role-play</button>`}</div>`}</div>`}
${p===3&&html`<div className="card"><h3>🎬 Role-play in progress</h3>${S.sc===2?html`<${Stage} phase=${3}/>`:null}<ul className="l">${S.actors.map(a=>html`<li><b>${nm(a.id)}</b> (${a.role}): ${a.role==='Actor 1'?c.a1:c.a2}</li>`)}</ul><p className="mut">${c.tr}</p><button className="btn" onClick=${()=>act({phase:4})}>Done. Ask the class the question</button></div>`}
${p===4&&html`<div><div className="card"><h3>❓ ${c.q}</h3>${S.mode==='decision'&&html`<p><b>Decision Mode:</b> no actors today. ${c.sit}</p>`}<p className="mut">Students are answering privately on their screens.</p><button className="chip" onClick=${simA}>Demo: simulate answers</button></div><${Summary} S=${S} c=${c}/><button className="btn teal" onClick=${()=>act({phase:5})}>Show discussion prompts</button></div>`}
${p===5&&html`<div><${Summary} S=${S} c=${c}/><div className="card"><h3>💬 Discussion prompts</h3><ul className="l"><li>What different choices did we hear?</li><li>What might happen after each choice?</li><li>Which choice helps everyone feel safe and included?</li><li>Did anyone change their mind while listening?</li></ul>${S.actors.length>0&&html`<p>Thank ${S.actors.map(a=>nm(a.id)).join(' and ')}, and everyone who watched. 👏</p>`}</div>
<button className="btn teal" onClick=${()=>go('observe')}>📝 Record observations</button><button className="btn" onClick=${next}>▶ Next scenario (fresh choices)</button></div>`}</div>`}

function Answer({c,S,act,sid}){const[sel,setSel]=useState(null);const[why,setWhy]=useState('');const a=S.answers[sid];
if(a)return html`<div><p style=${{color:'var(--teal)',fontWeight:800,fontSize:'19px'}}>✅ Answer saved privately.</p><p className="mut">Thinking it through matters more than matching anyone else.</p><button className="btn ghost" onClick=${()=>{const n={...S.answers};delete n[sid];act({answers:n})}}>Change my answer</button></div>`;
return html`<div><p style=${{fontWeight:800}}>${c.q}</p>${c.o.map((o,j)=>html`<button className=${'chip '+(sel===j?'on':'')} style=${{display:'block',width:'100%',textAlign:'left'}} onClick=${()=>setSel(j)}>${'ABCD'[j]}. ${o}</button>`)}
<p style=${{margin:'8px 0 4px',fontWeight:700}}>Tell us why (optional)</p><textarea rows="2" maxLength="140" value=${why} onInput=${e=>setWhy(e.target.value)}></textarea>
<button className="btn teal" disabled=${sel===null} onClick=${()=>act({answers:{...S.answers,[sid]:{a:sel,w:why.trim()}}})}>Send my answer</button></div>`}

function Student({S,act,sid,setSid,joined,setJoined}){const c=SC[S.sc],p=S.phase;const guest=sid.startsWith('guest:');const me=guest?sid.slice(6):nm(sid);
const emo=guest?'🙂':(STU.find(s=>s.id===sid)||{}).e;const my=S.resp[sid];const A=S.actors.find(a=>a.id===sid);const pend=S.pending&&S.pending.id===sid&&!S.spin;
const sub={display:'block',fontSize:'14px',fontWeight:600,fontFamily:'Nunito,sans-serif'};const choose=v=>act({resp:{...S.resp,[sid]:v}});
const ready=!!joined[sid];const help=STU.filter(s=>S.resp[s.id]==='help').length;const observe=STU.filter(s=>S.resp[s.id]==='observe').length;
const status=!S.live?'Waiting for teacher to launch a mission':p===0?'Teacher is introducing the mission':p===1?'Time to choose how you will participate':p<5?c.t:'Class discussion';
return html`<div><section className="mission-shell"><div className="eyebrow">✦ Room 5 • Sunshine Class • Student HQ</div>
<div className="student-hero"><div className="student-avatar">${emo}</div><div><h1>Hey, ${me}! 🚀</h1><p>Ready to make a difference today?</p></div></div>
<div className="mission-panel"><div className="mission-icon">${S.live?c.e:'🪐'}</div><div className="scenario-badge">${S.live?'MISSION IN PROGRESS':'YOUR NEXT ADVENTURE'}</div>
<h2>${S.live?c.t:'Your Classroom Mission'}</h2><p>${S.live?c.sit:'Your teacher is getting a teamwork adventure ready. Join the mission to let them know you’re here!'}</p>
${!ready?html`<button className="btn alt" onClick=${()=>setJoined(j=>({...j,[sid]:true}))}>🚀 Join Mission</button><p className="mut" style=${{textAlign:'center',marginBottom:0}}>Tap Join to enter the mission waiting room</p>`:
html`<div><div className="joined-tag">✓ YOU'VE JOINED THE MISSION</div>${!S.live?html`<div className="waiting-indicator" role="status"><span className="pulse-dot"></span> Waiting for teacher to start...</div>`:html`<div className="waiting-indicator" role="status"><span className="pulse-dot"></span> ${status}</div>`}</div>`}
</div><details className="student-selector"><summary>🧪 Demo: Switch student profile</summary><div>${STU.map(s=>html`<button className=${'chip '+(sid===s.id?'on':'')} onClick=${()=>setSid(s.id)}>${s.e} ${s.n}</button>`)}</div><p className="mut">These are fictional students on the same device.</p></details></section>
${ready&&S.live&&html`<div className="status-banner"><b>🔔 Mission update</b><div className="mut">${status}</div></div>`}
${ready&&S.live&&p<=2&&html`<div className="card"><div className="scenario-badge">TEACHER'S SCENARIO</div><h3>${c.e} ${c.t}</h3><p>${c.sit}</p><ul className="l"><li><b>Actor 1:</b> ${c.a1}</li>${c.a2&&html`<li><b>Actor 2:</b> ${c.a2}</li>`}<li><b>Teacher:</b> ${c.tr}</li></ul><p className="mut">It's pretend role-play. It's always okay to observe.</p></div>`}
${ready&&S.live&&p===1&&html`<div className="note"><h3>🙋 How do you want to take part?</h3><p className="mut">Choose privately. Helping and observing both count as participating.</p>
<button className=${'btn '+(my==='help'?'teal':'')} onClick=${()=>choose('help')}>🙋 I'll Help!<span style=${sub}>I want to volunteer for this role-play.</span></button>
<button className=${'btn '+(my==='observe'?'teal':'alt')} onClick=${()=>choose('observe')}>👀 I'll Observe!<span style=${sub}>I want to watch and share ideas afterward.</span></button>
${my&&html`<p className="joined-tag">✓ Your choice was saved: ${my==='help'?"I'll Help":"I'll Observe"}. You may change your mind.</p>`}
<div className="meter-label">Class participation • ${help+observe} of 6 responded</div><div className="class-meter" role="progressbar" aria-label="Class response rate" aria-valuemin="0" aria-valuemax="6" aria-valuenow=${help+observe}><div style=${{width:((help+observe)/6*100)+'%'}}></div></div><p className="mut">${help} volunteered to help • ${observe} chose to observe</p></div>`}
${ready&&S.live&&html`<div>${p===2&&html`<div>${pend?html`<div className="note s"><h3><span className="ring">🔔</span> You were picked as ${S.pending.role}!</h3><p>${S.pending.role==='Actor 1'?c.a1:c.a2}</p><p className="mut">It's okay to say no thanks. You can still watch and join the talk.</p><button className="btn teal" onClick=${()=>act({actors:[...S.actors,{id:sid,role:S.pending.role}],pending:null})}>👍 Yes, I'll do it!</button><button className="btn ghost" onClick=${()=>act({resp:{...S.resp,[sid]:'observe'},pending:null})}>No thanks, I'll observe</button></div>`:A?html`<div className="note s"><h3>🎭 You're ${A.role}</h3><p>${A.role==='Actor 1'?c.a1:c.a2}</p><p className="mut">Wait for your teacher's signal. You can step out any time.</p></div>`:html`<div className="card mut">${S.spin?'🎲 Your teacher is choosing helpers…':my==='help'?'Helpers are being chosen. If it is you, you can always say no thanks.':'Watch closely and think about what you would do.'}</div></div>`}</div>`}
${p===3&&html`<div>${A?html`<div className="note s"><h3>🚀 It's role-play time!</h3><p>${A.role==='Actor 1'?c.a1:c.a2}</p></div>`:html`<div className="card"><b>👀 Watch carefully.</b> <span className="mut">What would you do in this situation?</span></div>`}${S.sc===2&&html`<${Stage} phase=${3}/>`}</div>`}
${p===4&&html`<div className="note"><h3><span className="ring">❓</span> What would you do?</h3>${S.mode==='decision'&&html`<p className="mut">No actors today. We're thinking it through together.</p>`}<${Answer} key=${sid+S.sc} c=${c} S=${S} act=${act} sid=${sid}/></div>`}
${p===5&&html`<div className="card"><b>💬 Class discussion</b><p className="mut">Share your ideas out loud. Listen to different choices, and it's okay to change your mind.</p></div>`}</div>`}</div>`}

function Observe({S,obs,setObs,go}){const[st,setSt]=useState((S.actors[0]||{}).id||'maya');const[ck,setCk]=useState([]);const[nt,setNt]=useState('');const[ok,setOk]=useState(false);
const tg=k=>setCk(c=>c.includes(k)?c.filter(x=>x!==k):[...c,k]);
const doSave=()=>{const n=[{id:Date.now(),sid:st,act:SC[S.sc].t,ck,nt:nt.trim()},...obs];setObs(n);save(n);setCk([]);setNt('');setOk(true);setTimeout(()=>setOk(false),2500)};
return html`<div><button className="back" onClick=${()=>go('teacher')}>‹ Dashboard</button><h2>📝 Observation form</h2><p className="mut">Check what you noticed. This is a record of moments, not a score or a label.</p>
<div>${STU.map(s=>html`<button className=${'chip '+(st===s.id?'on':'')} onClick=${()=>{setSt(s.id);setCk([])}}>${s.e} ${s.n}</button>`)}</div>
${OBS.map(g=>html`<div className="card"><h3>${g.i} ${g.t}</h3>${g.o.map((o,j)=>html`<label className="chk"><input type="checkbox" checked=${ck.includes(g.k+j)} onChange=${()=>tg(g.k+j)}/>${o}</label>`)}</div>`)}
<div className="card"><h3>Optional notes</h3><textarea rows="3" value=${nt} placeholder="Anything else you noticed?" onInput=${e=>setNt(e.target.value)}></textarea></div>
<button className="btn teal" onClick=${doSave}>💾 Save observation for ${nm(st)}</button>${ok&&html`<div className="note t">✅ Saved on this device. See Classroom Insights.</div>`}</div>`}

function Observations({obs,setObs,go}){return html`<div><button className="back" onClick=${()=>go('teacher')}>‹ Dashboard</button><h2>Saved observations</h2>
${!obs.length&&html`<div className="card"><p className="mut">Nothing saved yet. Finish the activity and record what you noticed.</p><button className="btn" onClick=${()=>go('observe')}>Open observation form</button></div>`}
${obs.map(o=>html`<div className="card"><b>${nm(o.sid)}</b> <span className="pill">${o.act}</span><ul className="l">${o.ck.length?o.ck.map(c=>html`<li>${OBS.find(g=>g.k===c[0]).o[+c.slice(1)]}</li>`):html`<li className="mut">No boxes checked</li>`}</ul>${o.nt&&html`<p className="mut">“${o.nt}”</p>`}</div>`)}
${obs.length>0&&html`<button className="btn ghost" onClick=${()=>{setObs([]);save([])}}>Clear my saved observations</button>`}</div>`}

function Insights({obs,go}){const N=SAMPLE_N+obs.length;
const cnt=(k,j)=>SAMPLE[k][j]+obs.filter(o=>o.ck.includes(k+j)).length;
const part=new Set(obs.map(o=>o.sid)).size;const pc=Math.min(6,SAMPLE_STU+[...new Set(obs.map(o=>o.sid))].filter(x=>!['maya','leo','zara','noah','priya'].includes(x)).length);
const all=OBS.flatMap(g=>g.o.map((o,j)=>({k:g.k,o,v:cnt(g.k,j)/N,t:g.t}))).sort((a,b)=>a.v-b.v).slice(0,3);
const C=2*Math.PI*40,Bars=({g,col})=>html`<div>${g.o.map((o,j)=>html`<div><div style=${{display:'flex',justifyContent:'space-between',fontWeight:700}}><span>${o}</span><span className="mut">${cnt(g.k,j)} of ${N}</span></div><div className="bar2"><i style=${{width:Math.round(cnt(g.k,j)/N*100)+'%',background:col}}></i></div></div>`)}</div>`;
return html`<div><button className="back" onClick=${()=>go('teacher')}>‹ Dashboard</button><h2>📊 Classroom Insights</h2>
<div className="demo">SAMPLE DATA plus your ${obs.length} saved observation${obs.length===1?'':'s'}. Patterns describe moments seen, not children.</div>
<div className="card"><h3>Class participation overview</h3><div style=${{display:'flex',alignItems:'center',gap:'16px',marginTop:'8px'}}><svg width="110" height="110" viewBox="0 0 100 100" role="img" aria-label=${pc+' of 6 students observed'}><circle cx="50" cy="50" r="40" fill="none" stroke="var(--soft)" strokeWidth="14"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--teal)" strokeWidth="14" strokeLinecap="round" strokeDasharray=${C} strokeDashoffset=${C*(1-pc/6)} transform="rotate(-90 50 50)"/><text x="50" y="57" textAnchor="middle" fontSize="22" fontFamily="Fredoka" fontWeight="700" fill="var(--ink)">${pc}/6</text></svg><span>${pc} of 6 students have been part of recorded activities so far.</span></div></div>
<div className="card"><h3>💬 Observed communication patterns</h3><${Bars} g=${OBS[0]} col="var(--pri)"/></div>
<div className="card"><h3>🤝 Collaboration observations</h3><${Bars} g=${OBS[1]} col="var(--teal)"/><${Bars} g=${OBS[5]} col="var(--coral)"/></div>
<div className="card"><h3>🌱 Where more practice may help</h3><p className="mut">Moments seen less often so far. These are opportunities for the whole class, not shortcomings in any child.</p><ul className="l">${all.map(a=>html`<li><b>${a.o}</b> <span className="mut">(${a.t}, ${Math.round(a.v*100)}%)</span></li>`)}</ul></div>
<div className="card"><h3>💡 Suggested classroom activities</h3><ul className="l">${all.map(a=>html`<li>${SUGG[a.k]}</li>`)}</ul></div>
<p className="mut">EduKonic is not a diagnostic tool. It doesn't label, score, or rank students.</p></div>`}

function Program({go}){let d=0;return html`<div><button className="back" onClick=${()=>go('teacher')}>‹ Dashboard</button><h2>🗓 30-Day Program</h2><p className="mut">Day 1 is fully interactive in this prototype. Other days are planned lessons.</p>
${WEEKS.map(([t,c,ds])=>html`<div className="card wk" style=${{borderLeftColor:c}}><h3>${t}</h3>${ds.map(x=>{d++;const n=d;return html`<div className="day"><em>Day ${n}</em><span>${x}</span>${n===1?html`<span className="pill" style=${{marginLeft:'auto'}}>Live demo</span>`:html`<span className="pill" style=${{marginLeft:'auto'}}>Planned</span>`}</div>`})}</div>`)}
${html`<button className="btn" onClick=${()=>go('activity')}>▶ Try Day 1 now</button>`}</div>`}

function App(){const[scr,setScr]=useState('welcome');const[sid,setSid]=useState('maya');const[S,setS]=useState(S0);const[obs,setObs]=useState(load);const[joined,setJoined]=useState({});
const act=p=>setS(s=>({...s,...p}));const go=s=>{setScr(s);window.scrollTo(0,0)};
const mode=scr==='student'||scr==='slogin'?'s':scr==='welcome'?'':'t';
const tab=m=>{if(m==='t')go('teacher');else go('student')};
return html`<div className="app"><div className="bar"><div className="logo" style=${{cursor:'pointer',display:'flex',alignItems:'center',gap:'8px'}} onClick=${()=>go('welcome')}><${Brand}/> Edu<b>Konic</b></div>
${scr!=='welcome'&&html`<div className="sw" role="group" aria-label="Demo mode switch"><button className=${mode==='t'?'on':''} onClick=${()=>tab('t')}>Teacher</button><button className=${mode==='s'?'on':''} onClick=${()=>tab('s')}>Student</button></div>`}</div>
<div className="demo">DEMO MODE · Prototype on one device · Fictional students only</div>
${scr==='welcome'&&html`<${Welcome} go=${go}/>`}
${scr==='slogin'&&html`<${SLogin} pick=${id=>{setSid(id);go('student')}}/>`}
${scr==='teacher'&&html`<${Teacher} S=${S} act=${act} go=${go} obsN=${obs.length} joined=${joined}/>`}
${scr==='activity'&&html`<${Activity} S=${S} act=${act} go=${go}/>`}
${scr==='student'&&html`<${Student} S=${S} act=${act} sid=${sid} setSid=${setSid} joined=${joined} setJoined=${setJoined}/>`}
${scr==='observe'&&html`<${Observe} S=${S} obs=${obs} setObs=${setObs} go=${go}/>`}
${scr==='observations'&&html`<${Observations} obs=${obs} setObs=${setObs} go=${go}/>`}
${scr==='insights'&&html`<${Insights} obs=${obs} go=${go}/>`}
${scr==='program'&&html`<${Program} go=${go}/>`}
${scr!=='welcome'&&html`<button className="btn ghost" style=${{fontSize:'15px'}} onClick=${()=>{act({...S0});setJoined({});go('welcome')}}>↺ Reset demo and return to start</button>`}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
